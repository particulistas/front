name: 🚀 Deploy Nuxt.js to VPS

on:
  push:
    branches:
      - main  # Cambia esto si usas otra rama para producción

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Clonar el repositorio
        uses: actions/checkout@v4

      - name: 🔑 Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: 📡 Conectarse al VPS y desplegar Nuxt.js
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd /var/www/html/particulistas/front
            git pull origin main
            npm install
            npm run build
            pm2 restart nuxt-app || pm2 start "npm run start" --name "nuxt-app"
            pm2 save
          EOF